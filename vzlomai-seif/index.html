<title>Взломай сейф</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Nunito:wght@500;700;800&family=Rubik:wght@600;800&display=swap">
<style>
/* Идея раскладки: слева сейф с лампочками, справа агент, звёзды и награды. Один экран, без вкладок. */
:root {
  --bg: #E9EEF1;
  --panel: #FFFFFF;
  --panel-2: #F3F6F8;
  --ink: #13222B;
  --muted: #566A77;
  --line: #CBD6DD;
  --accent: #0B7A8C;
  --accent-ink: #FFFFFF;
  --lamp: #FFB800;
  --lamp-glow: rgba(255, 184, 0, .5);
  --lamp-off: #D5DEE4;
  --good: #12935B;
  --bad: #D33A2C;
  --warn: #A86A00;
  --steel-1: #C9D3DA;
  --steel-2: #A7B5C0;
  --screen: #0F2630;
  --screen-ink: #FFE29A;
  --f-display: "Rubik", system-ui, sans-serif;
  --f-body: "Nunito", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E171D; --panel: #16232B; --panel-2: #1C2C36; --ink: #E6EEF3; --muted: #93A6B3; --line: #283943;
    --accent: #3CC3D6; --accent-ink: #06222A; --lamp-off: #2D3F4B; --good: #3DD598; --bad: #FF7B6E; --warn: #FFC15E;
    --steel-1: #3B4B56; --steel-2: #2A3842; --screen: #0A1A22; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E171D; --panel: #16232B; --panel-2: #1C2C36; --ink: #E6EEF3; --muted: #93A6B3; --line: #283943;
  --accent: #3CC3D6; --accent-ink: #06222A; --lamp-off: #2D3F4B; --good: #3DD598; --bad: #FF7B6E; --warn: #FFC15E;
  --steel-1: #3B4B56; --steel-2: #2A3842; --screen: #0A1A22; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 500 16px/1.5 var(--f-body);
  padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; line-height: 1.15; }
h2 { font-size: 1.2rem; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { width: 46px; height: 46px; border-radius: 50%; flex: none; border: 5px solid var(--accent);
  background: radial-gradient(circle, var(--accent) 0 5px, transparent 6px), var(--panel); position: relative; }
.logo::before, .logo::after { content: ""; position: absolute; left: 50%; top: 50%; width: 3px; height: 28px; background: var(--accent); transform: translate(-50%, -50%); border-radius: 2px; }
.logo::after { transform: translate(-50%, -50%) rotate(90deg); }
.brand h1 { font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 800; }
.brand p { color: var(--muted); font-size: .95rem; }
.snd { border: 2px solid var(--line); background: var(--panel); border-radius: 12px; padding: 8px 14px; font-weight: 800; min-height: 44px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; min-width: 0; }
.grid-game { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.kicker { font: 700 .8rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.mission { margin-top: 4px; color: var(--accent); font-weight: 800; }
.story { margin: 8px 0 14px; max-width: 62ch; }
.ititle { margin: 6px 0 4px; font-size: 1.5rem; }

/* сейф */
.stage { position: relative; perspective: 900px; overflow: hidden; border-radius: 16px; background: linear-gradient(145deg, var(--steel-1), var(--steel-2)); padding: 14px; }
.inside { position: absolute; inset: 14px; border-radius: 10px; display: grid; place-items: center; text-align: center;
  background: radial-gradient(circle at 50% 40%, var(--lamp-glow), transparent 70%), var(--screen); color: var(--screen-ink);
  font: 800 1.3rem var(--f-display); padding: 10px; }
.door { position: relative; transform-origin: left center; transition: transform .9s cubic-bezier(.5, 0, .2, 1);
  background: linear-gradient(145deg, var(--steel-1), var(--steel-2)); border-radius: 10px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 6px; }
.stage.open .door { transform: rotateY(-78deg); }
.screen { background: var(--screen); color: var(--screen-ink); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; min-width: 0; }
.screen .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.screen .lab { font: 700 .75rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; opacity: .75; }
.screen .big { font: 700 clamp(1.6rem, 6vw, 2.4rem) var(--f-mono); line-height: 1.1; display: inline-block; }
.screen .big.pop { animation: pop .3s; }
.screen .bin { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font: 700 1rem var(--f-mono); letter-spacing: .25em; }
.screen .bin .lab { letter-spacing: .06em; }
.word { letter-spacing: .3em; }
.dial { width: 70px; height: 70px; border-radius: 50%; border: 6px solid var(--panel); background: radial-gradient(circle, var(--panel) 0 6px, transparent 7px), var(--steel-2); position: relative; transition: transform 1s ease; }
.dial::before, .dial::after { content: ""; position: absolute; left: 50%; top: 50%; width: 5px; height: 100%; background: var(--panel); transform: translate(-50%, -50%); border-radius: 3px; }
.dial::after { transform: translate(-50%, -50%) rotate(90deg); }
.stage.open .dial { transform: rotate(540deg); }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }

/* лампочки */
.lamps { display: grid; gap: 8px; margin-top: 16px; }
.lamp { border: 0; background: none; padding: 4px 0; display: grid; justify-items: center; gap: 4px; min-width: 0; border-radius: 12px; }
.lamp .lv { font: 700 clamp(.75rem, 2.4vw, 1.05rem) var(--f-mono); }
.lamp .bulb { width: 100%; max-width: 54px; aspect-ratio: 1; border-radius: 50%; background: var(--lamp-off); border: 3px solid var(--line); transition: background .15s, box-shadow .15s, transform .1s; }
.lamp[aria-pressed="true"] .bulb { background: var(--lamp); border-color: var(--lamp); box-shadow: 0 0 0 5px var(--lamp-glow), 0 0 22px 4px var(--lamp-glow); animation: glow .35s; }
.lamp:active .bulb { transform: scale(.92); }
.lamp .bd { font: 700 .95rem var(--f-mono); color: var(--muted); }
.lamp[disabled] { cursor: default; }
.lamps.nodig .bd { visibility: hidden; }
@keyframes glow { 0% { transform: scale(.85); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
.ione { display: grid; justify-items: center; gap: 10px; margin: 14px 0; }
.ione .lamp { width: 96px; }
.ilabel { font: 800 1.2rem var(--f-display); min-height: 1.6em; text-align: center; }
.isum { margin-top: 12px; font: 800 1.15rem var(--f-display); text-align: center; min-height: 1.6em; }
.letters { margin-top: 12px; background: var(--panel-2); border: 1px dashed var(--line); border-radius: 12px; padding: 10px 12px; font: 500 .95rem var(--f-mono); }
.pix { display: grid; gap: 6px; margin-top: 16px; justify-content: center; }
.prow { display: grid; grid-template-columns: 3.2ch repeat(5, minmax(0, 52px)) 3.2ch; gap: 6px; align-items: center; }
.prow .pt { font: 800 1.1rem var(--f-mono); text-align: right; color: var(--accent); }
.prow .pn { font: 500 .95rem var(--f-mono); color: var(--muted); }
.cell { aspect-ratio: 1; border: 2px solid var(--line); background: var(--lamp-off); border-radius: 8px; transition: background .12s; padding: 0; }
.cell[aria-pressed="true"] { background: var(--lamp); border-color: var(--lamp); box-shadow: 0 0 12px var(--lamp-glow); }
.pcap { text-align: center; color: var(--muted); font-size: .9rem; margin-top: 6px; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.btn { border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); font: 800 1rem var(--f-display); padding: 10px 20px; border-radius: 12px; min-height: 46px; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.wide { width: 100%; }
.msg { min-height: 1.6em; margin-top: 10px; font-weight: 700; }
.msg.bad { color: var(--bad); }
.msg.good { color: var(--good); }
.hintbox, .learn { margin-top: 10px; border-radius: 12px; padding: 10px 14px; background: var(--panel-2); border: 1px solid var(--line); }
.learn { border-color: var(--good); }
.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }

/* летящие числа */
.chip { position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; font: 800 1.3rem var(--f-mono); color: var(--accent); text-shadow: 0 1px 0 var(--panel); }
.chip.bad { color: var(--bad); }
.fx { position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; border-radius: 50%; }

/* правая колонка */
.side { display: grid; gap: 18px; }
.agent label { display: block; font: 700 .8rem var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
.agent input { width: 100%; font: 700 1.1rem var(--f-body); padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel-2); color: var(--ink); }
.total { display: flex; align-items: baseline; justify-content: space-between; margin-top: 12px; gap: 10px; flex-wrap: wrap; }
.total b { font: 800 2.2rem var(--f-display); color: var(--accent); }
.streak { font: 800 .9rem var(--f-mono); color: var(--warn); }
.levels { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }
.levels li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); }
.levels li.cur { border-color: var(--accent); background: var(--panel-2); }
.levels .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 800 .85rem var(--f-mono); background: var(--lamp-off); flex: none; }
.levels li.done .n { background: var(--good); color: #fff; }
.levels .t { flex: 1; min-width: 0; }
.levels .p { font: 700 .85rem var(--f-mono); color: var(--lamp); letter-spacing: .1em; }
.badges { list-style: none; margin: 12px 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.badges li { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; border: 1px dashed var(--line); color: var(--muted); font-size: .85rem; font-weight: 700; }
.badges li .ic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--lamp-off); font: 800 .8rem var(--f-mono); }
.badges li.on { border: 1px solid var(--lamp); color: var(--ink); background: var(--panel-2); }
.badges li.on .ic { background: var(--lamp); color: #1B1400; }
.badges li.fresh { animation: pop .6s; }

/* лаборатория и имя */
.labgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.labgrid .cellv { background: var(--screen); color: var(--screen-ink); border-radius: 12px; padding: 10px 12px; }
.labgrid .cellv span { display: block; font: 700 .72rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; opacity: .75; }
.labgrid .cellv b { font: 700 1.8rem var(--f-mono); }
.swatch { height: 38px; border-radius: 8px; border: 2px solid var(--screen-ink); margin-top: 4px; }
.nrows { display: grid; gap: 8px; margin-top: 14px; }
.nrow { display: grid; grid-template-columns: 2ch 4ch minmax(0, 1fr); gap: 12px; align-items: center; }
.nrow b { font: 800 1.3rem var(--f-mono); }
.nrow .code { font: 700 .95rem var(--f-mono); color: var(--muted); }
.mini { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 5px; max-width: 320px; }
.mini i { aspect-ratio: 1; border-radius: 50%; background: var(--lamp-off); display: block; }
.mini i.on { animation: lampon .35s forwards; animation-delay: var(--d, 0s); }
@keyframes lampon { to { background: var(--lamp); box-shadow: 0 0 10px var(--lamp-glow); } }
.nin { width: 100%; max-width: 360px; font: 800 1.2rem var(--f-mono); padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel-2); color: var(--ink); text-transform: uppercase; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 14px; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 30px); opacity: 0; transition: opacity .25s, transform .25s; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 12px; font-weight: 800; z-index: 60; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 860px) {
  .grid-game { grid-template-columns: minmax(0, 1fr); }
  .door { grid-template-columns: minmax(0, 1fr); }
  .dial { display: none; }
  .labgrid { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  .door, .dial, .lamp .bulb { transition: none; }
  .shake, .lamp[aria-pressed="true"] .bulb, .screen .big.pop, .badges li.fresh { animation: none; }
  .mini i.on { animation-duration: .01s; animation-delay: 0s; }
}
</style>

</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {

    { kind: 'letter', n: 8, target: 75, title: 'Шпионский штаб',
      story: 'Здесь код — буква K. Компьютер хранит буквы как числа. Вот начало таблицы, дальше всё идёт по порядку алфавита. Найди число для K и включи его.',

      sfx.tick(on); paintIntro(); return;
    }
    if (t.id === 'inext') { if (I.step < 2) { I.step++; renderIntro(); } else { G.intro = false; renderLevel(); } return; }
    if (t.id === 'iskip') { G.intro = false; renderLevel(); return; }
    var gl = t.closest('.glamp'), ll = t.closest('.llamp'), cell = t.closest('.cell');
    if (gl && !G.solved) {
      var i = +gl.dataset.i, n = G.bits.length, val = Math.pow(2, n - 1 - i), nowOn = !G.bits[i];
      G.bits[i] = nowOn ? 1 : 0; sfx.tick(nowOn); paint();
      flyChip($('.bulb', gl), (nowOn ? '+' : '−') + val, !nowOn); return;
    }
    if (ll) { var j = +ll.dataset.i; G.lab[j] = G.lab[j] ? 0 : 1; sfx.tick(!!G.lab[j]); paintLab(); return; }
    if (cell && !G.solved) { var r = +cell.dataset.r, c = +cell.dataset.c; G.cells[r][c] = G.cells[r][c] ? 0 : 1; sfx.tick(!!G.cells[r][c]); paint(); return; }
    if (t.id === 'open') { if (t.dataset.next) { G.lvl++; renderLevel(); } else check(); return; }
    if (t.id === 'hint') { G.hint = true; $('#extra').innerHTML = '<div class="hintbox"><b>Подсказка.</b> ' + esc(LEVELS[G.lvl].hint) + '</div>'; return; }
    if (t.id === 'again') { G.lvl = 0; G.score = 0; G.done = []; G.stars = []; G.streak = 0; G.intro = false; renderLevel(); return; }
    if (t.id === 'golab') { renderLab(); return; }
    if (t.id === 'goname') { renderName(); return; }
    if (t.id === 'lback') { renderFinish(); return; }
    if (t.id === 'lreset') { G.lab = [0, 0, 0, 0, 0, 0, 0, 0]; paintLab(); return; }
    if (t.id === 'lrand') { var v = Math.floor(Math.random() * 256); for (var q = 0; q < 8; q++) G.lab[q] = (v >> (7 - q)) & 1; sfx.tick(true); paintLab(); return; }
  });
  gamecard.addEventListener('input', function (e) { if (e.target.id === 'nin') paintName(); });
  $('#agent').addEventListener('input', function (e) { G.name = e.target.value.trim() || 'Агент'; });
  $('#reintro').addEventListener('click', function () { G.intro = true; I.step = 0; I.one = 0; I.bits = [0, 0, 0, 0]; renderIntro(); });

  renderIntro();
})();
</script>

</body></html>
